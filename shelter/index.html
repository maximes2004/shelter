<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cozy House - приют для зверей</title>
    <link rel="stylesheet" href="normalize.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <header class="header">
      <div class="container header__container">
        <div class="header__logo-wrapper">
          <div class="header__logo-title">Cozy House</div>
          <div class="header__logo-subtitle">Shelter for pets in Boston</div>
        </div>
        <div class="header__burger-wrapper">
          <input
            type="checkbox"
            id="burger-checkbox"
            class="header__burger-checkbox visually-hidden"
          />
          <label for="burger-checkbox" class="header__burger-btn">
            <span class="header__burger-dash"></span>
            <span class="header__burger-dash"></span>
            <span class="header__burger-dash"></span>
          </label>
        </div>
        <nav class="header__nav">
          <ul class="header__nav-list">
            <li class="header__nav-item">
              <a href="" class="header__nav-link">About the shelter</a>
            </li>
            <li class="header__nav-item">
              <a href="" class="header__nav-link">Our pets</a>
            </li>
            <li class="header__nav-item">
              <a href="" class="header__nav-link">Help the shelter</a>
            </li>
            <li class="header__nav-item">
              <a href="" class="header__nav-link">Contacts</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="">
      <section class="hero">
        <div class="container hero__container">
          <div class="hero__content"></div>
          <div class="hero__img"></div>
        </div>
      </section>
    </main>
  </body>
</html>
